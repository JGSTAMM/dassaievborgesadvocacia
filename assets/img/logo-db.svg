  <path d="M13 30 C24 27, 45 27, 45 43 C45 57, 25 60, 14 59" stroke="#231F20" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <path d="M23 31 L20 58" stroke="#231F20" stroke-width="2.5" stroke-linecap="round" />
  <path d="M46 31 L45 61" stroke="#231F20" stroke-width="2.5" stroke-linecap="round" />
  <path d="M42 32 C54 28, 61 31, 59 38 C57 43, 49 45, 45 45 C56 44, 68 47, 67 56 C66 64, 49 66, 39 63" stroke="#231F20" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Tipografia Oficial DASSAIEV BORGES advocacia -->
  <text x="92" y="43" fill="#F8F6F2" font-family="'Cormorant Garamond', Georgia, serif" font-size="25" font-weight="700" letter-spacing="2.5">DASSAIEV BORGES</text>
  <line x1="92" y1="52" x2="348" y2="52" stroke="url(#bronzeGrad)" stroke-width="1.5" />
  <text x="220" y="70" fill="#D5D7E0" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="13.5" font-weight="500" letter-spacing="4.5" text-anchor="middle">advocacia</text>
